name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-format-test:
    name: lint-format-test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wallet
          POSTGRES_PASSWORD: wallet
          POSTGRES_DB: wallet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wallet -d wallet"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # 1.25 matches the floor declared in go.mod (driven by
          # pgx/v5 ≥ 5.9.0 which raised its minimum to 1.25.0).
          go-version: '1.25'

      - name: Install golangci-lint
        # Build from source via `go install` so the resulting binary
        # is compiled with the same Go toolchain the workflow uses
        # above. The published binary releases of golangci-lint
        # v1.64.8 were built with Go 1.24, which trips the
        # "language version used to build golangci-lint is lower
        # than the targeted Go version" check on any module that
        # declares `go 1.25` in go.mod. Building locally sidesteps
        # the check.
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: gofmt check
        run: |
          set -euo pipefail
          test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }

      - name: go vet
        run: go vet ./...

      - name: golangci-lint (default)
        run: golangci-lint run ./...

      - name: golangci-lint (integration build tag)
        run: golangci-lint run --build-tags=integration ./...

      - name: Unit tests
        run: go test -race -cover ./...

      - name: Integration tests
        env:
          DATABASE_URL: postgres://wallet:wallet@localhost:5432/wallet?sslmode=disable
        run: go test -race -tags=integration -count=1 -timeout=300s ./...
