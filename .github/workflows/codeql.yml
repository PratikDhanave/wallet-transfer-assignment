name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run so the analysis stays current with new CodeQL queries
    # even when there are no code changes.
    - cron: "23 5 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  analyze:
    name: codeql
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [go]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality includes both security queries and broader
          # code-quality queries. Drop to "security-extended" or "security"
          # if quality findings prove too noisy for the team.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
