# Claude Code Action — automated PR review.
#
# Runs on every pull-request event. Triggers Claude to read the diff,
# leave inline review comments on issues, and reply to follow-ups when
# a reviewer or the PR author @-mentions @claude in a comment.
#
# Setup:
#   1. Install the Claude Code GitHub App on the repo or org:
#      https://github.com/apps/claude
#   2. Add an ANTHROPIC_API_KEY secret to the repo (Settings →
#      Secrets and variables → Actions → New repository secret).
#      For Bedrock / Vertex, set the corresponding secret pair and
#      switch the `use_bedrock`/`use_vertex` inputs below.
#
# Permissions:
#   - contents: read       (clone the repo)
#   - pull-requests: write (post review comments)
#   - issues: write        (post comments on the PR conversation)
#
# Security note:
#   The agent only runs against PR diffs and respects the project's
#   AGENTS.md (security rules, layering, etc.). It cannot modify CI
#   configuration unless the PR itself does.

name: claude-review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: claude-review
    runs-on: ubuntu-latest
    # Only trigger on PR-related events (skip @claude comments on
    # plain issues that aren't tied to a PR).
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      github.event_name == 'pull_request_review_comment'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so Claude can diff against base

      - name: Claude Code Action
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Mirror the security-first instructions in AGENTS.md so
          # the auto-reviewer applies the same standards as a
          # human reviewer running /secure-review.
          system_prompt: |
            You are reviewing pull requests for a wallet-transfer
            service that moves real money. Apply the rules in
            AGENTS.md (security, architecture, testing) strictly.
            Focus on:
              - SQL injection / parameterization
              - Transaction boundaries and SELECT ... FOR UPDATE
              - Idempotency (PK on idempotency_records.key)
              - Lock ordering (orderedPair) to avoid deadlocks
              - Money math is int64 (never float)
              - Error responses must not leak DB internals
              - Tests cover concurrency for any new wallet write path
            Cite file:line for every finding. Distinguish BLOCKING
            from WARNING from NOTE. Skip stylistic nits.
